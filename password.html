<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASSWORD</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>

     
    <div class="container">

       
        <h2>
           CREATE PASSWORD
        </h2>

        <form id="formlogin">

            <div class="input-group">
                <p>Password</p>
                <input type="password" id="password" placeholder="*****">

                <button type="button" class="toggle-btn" data-target="password">
                    show
                </button>

                <div class="strength" id="strengthBar"></div>

                <div class="error" id="passwordError"></div>
            </div>

            <div class = "required">
                <p>*password must be 8 character long</p>
                <p>*password must contain atleast one Uppercase</p>
                <p>*password must contain atleast one Lowercase</p>
                <p>*password must contain atleast one number</p>
                <p>*password must contain one special character</p>
            </div>

            <!-- register button -->
             <br>
             <div class="login">
                <button type="submit" class="submit-btn">Sign Up</button>
             </div>

        </form>
        

    </div>

    

    <script src="password.js"></script>
</body>
</html>
